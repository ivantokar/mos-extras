name: Verify Molecules

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build all Molecules
        run: swift build
      - name: Run Molecule 001
        run: swift run molecule-001
      - name: Run Molecule 002
        run: swift run molecule-002
